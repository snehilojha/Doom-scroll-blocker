<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Doom Scroll Blocker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .toggle-section {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }
    
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
      border-radius: 26px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #4ade80;
    }
    
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    
    .stats {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .stats h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      opacity: 0.9;
    }
    
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    
    .stat-label {
      opacity: 0.8;
    }
    
    .stat-value {
      font-weight: 600;
    }
    
    .current-tier {
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    
    .buttons {
      display: flex;
      gap: 8px;
    }
    
    button {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .footer {
      text-align: center;
      font-size: 11px;
      margin-top: 16px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌀 Doom Scroll Blocker</h1>
    <p>Chaotic Good Edition</p>
  </div>
  
  <div class="toggle-section">
    <div class="toggle-container">
      <span class="toggle-label">Protection Active</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div class="stats">
    <h2>📊 Today's Stats</h2>
    <div class="stat-row">
      <span class="stat-label">Interrupts saved</span>
      <span class="stat-value" id="sessionInterrupts">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Total saved</span>
      <span class="stat-value" id="totalInterrupts">0</span>
    </div>
    <div class="current-tier" id="currentTier">
      Current tier: Wholesome ✨
    </div>
  </div>
  
  <div class="buttons">
    <button id="resetBtn">Reset Stats</button>
    <button id="optionsBtn">Settings</button>
  </div>
  
  <div class="footer">
    Keeping you weird since 2025
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
